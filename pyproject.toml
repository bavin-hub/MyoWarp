[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "myowarp"
version = "0.1.0"
description = "MuJoCo Warp port scaffold for MyoAssist leg imitation environments"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "torch",
    "mujoco>=3.3.3",
    "gymnasium>=0.29",
]

[project.optional-dependencies]
warp = [
    "mujoco-warp",
]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
include = ["myowarp*"]
