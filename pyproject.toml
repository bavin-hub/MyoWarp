[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "myowarp"
version = "0.1.0"
description = "Standalone MuJoCo-Warp reinforcement-learning tasks for assisted humanoid locomotion"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "torch",
    "mujoco==3.5.0",
    "gymnasium>=0.29",
    "mujoco-warp==3.5.0",
    "warp-lang==1.12.0",
    "rsl-rl-lib>=5.4.2,<6",
    "scipy",
]

[project.optional-dependencies]
warp = [
]
dev = [
    "pytest",
]

[tool.uv.sources]
rsl-rl-lib = { path = "rsl_rl", editable = true }

[tool.setuptools.packages.find]
include = ["myowarp*"]
